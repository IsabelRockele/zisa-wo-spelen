<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#145c57">
  <meta name="description" content="Oefen de woordenschat van Thema 1 - Op stap in Bornem.">
  <title>Zisa WO Spelen - Op stap in Bornem</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="board.css">
  <link rel="stylesheet" href="fun.css">
  <link rel="stylesheet" href="tablet.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="nav-buttons">
      <a class="hub-button" id="hubButton" href="../" aria-label="Terug naar de thema's van het tweede leerjaar"><span aria-hidden="true">←</span> Alle thema’s</a>
      <button class="hub-button game-menu-button" id="homeButton" type="button" aria-label="Terug naar de oefeningen van Bornem" hidden><span aria-hidden="true">←</span> Oefeningen</button>
    </div>
    <div class="brand"><span class="brand-dot">Z</span><div><small>ZISA WO SPELEN</small><strong>Op stap in Bornem</strong></div></div>
    <div class="top-actions"><button class="icon-button" id="readButton" type="button" aria-label="Lees de opdracht en antwoorden voor">🔊</button><button class="icon-button" id="teacherButton" type="button" aria-label="Leerkrachtenvenster">QR</button></div>
  </header>

  <main id="app" class="shell" aria-live="polite"></main>

  <dialog id="teacherDialog">
    <button class="dialog-close" id="closeTeacher" type="button" aria-label="Sluiten">×</button>
    <p class="eyebrow">VOOR DE LEERKRACHT</p>
    <h2>Oefenen via de QR-code</h2>
    <p>Na publicatie bevat deze QR-code automatisch het adres van deze pagina. Print hem of projecteer hem in de klas.</p>
    <div id="qrBox" class="qr-box"></div>
    <p id="qrMessage" class="small-note"></p>
    <button id="copyLink" class="primary-button" type="button">Kopieer de link</button>
    <button id="printQr" class="secondary-button" type="button">Print de QR-code</button>
  </dialog>

  <template id="menuTemplate">
    <section class="hero">
      <div>
        <p class="eyebrow">THEMA 1 · 2DE LEERJAAR</p>
        <h1>Ken jij Bornem al goed?</h1>
        <p>Oefen de woorden, bekijk echte plekken en maak je klaar voor de toets.</p>
        <div class="progress-line"><span id="progressBar"></span></div>
        <p id="progressText" class="progress-text"></p>
        <div class="hero-stickers" aria-hidden="true"><span>🏠</span><span>🗺️</span><span>🌳</span><span>🚲</span></div>
      </div>
      <img src="assets/images/gemeentehuis-bornem.jpg" alt="Het gemeentehuis van Bornem">
    </section>
    <section>
      <h2 class="section-title">Kies een oefening</h2>
      <div id="gameGrid" class="game-grid"></div>
    </section>
    <section class="bornem-strip">
      <img src="assets/images/kasteel-bornem.jpg" alt="Kasteel van Bornem">
      <div><p class="eyebrow">ECHT IN ONZE GEMEENTE</p><h2>Van het station tot Breeven</h2><p>In de oefeningen herken je gebouwen en plaatsen die je zelf in Bornem kunt tegenkomen.</p></div>
    </section>
  </template>
</body>
</html>
