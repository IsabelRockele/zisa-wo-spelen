<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Duidelijke legende bij een gemeentekaart</title><desc id="desc">Een grote legende toont hoe kleuren en symbolen op een kaart worden uitgelegd. Rechts staat een kleine voorbeeldkaart.</desc><rect width="1000" height="700" fill="#f7fbf8"/><text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="42" font-weight="900" fill="#17313a">DE LEGENDE</text><rect x="45" y="90" width="620" height="565" fill="#fff" stroke="#14766f" stroke-width="10"/><text x="355" y="142" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#40575e">Zo begrijp je de kleuren en symbolen op de kaart.</text><g font-family="Arial" font-size="29" font-weight="800" fill="#17313a"><rect x="95" y="190" width="100" height="55" fill="#f2d06b" stroke="#9c7a17" stroke-width="4"/><text x="235" y="228">= landbouwgebied</text><rect x="95" y="285" width="100" height="55" fill="#7fc98d" stroke="#26733b" stroke-width="4"/><text x="235" y="323">= natuurgebied</text><rect x="95" y="380" width="100" height="55" fill="#ef9b91" stroke="#a53c34" stroke-width="4"/><text x="235" y="418">= woongebied</text><circle cx="145" cy="505" r="25" fill="#2779b8" stroke="#164f7b" stroke-width="5"/><text x="235" y="516">= school</text><path d="M95 590h100" stroke="#d43c32" stroke-width="12"/><text x="235" y="600">= gemeentegrens</text></g><rect x="710" y="145" width="245" height="430" fill="#eaf3e7" stroke="#273f45" stroke-width="8"/><path d="M730 180h95v120h-95z" fill="#f2d06b"/><path d="M825 180h110v120H825z" fill="#7fc98d"/><path d="M730 300h205v170H730z" fill="#ef9b91"/><path d="M730 470h205v80H730z" fill="#7fc98d"/><path d="M730 375h205" stroke="#d43c32" stroke-width="9"/><circle cx="840" cy="390" r="18" fill="#2779b8" stroke="#164f7b" stroke-width="4"/><text x="840" y="430" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800">school</text><text x="832" y="620" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#40575e">Voorbeeldkaart</text></svg>
