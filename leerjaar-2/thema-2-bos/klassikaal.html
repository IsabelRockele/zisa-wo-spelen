<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klassikaal woordenschatspel</title><link rel="stylesheet" href="woordenschat.css"><style>main{max-width:1000px}.game{background:white;border:4px solid #87ac80;border-radius:30px;padding:24px;text-align:center}.big-photo{display:none;width:min(100%,420px);aspect-ratio:3/4;margin:12px auto;border-radius:22px;background-repeat:no-repeat;background-size:400% 200%;background-color:#eef3eb}.big-photo.shown{display:block}.task{font-size:clamp(25px,4vw,42px);font-weight:900;margin:18px}.word{font-size:clamp(40px,7vw,74px);color:#315b2a;margin:8px}.secret{font-size:clamp(22px,3vw,32px);background:#fff5c8;border:3px dashed #d4a900;border-radius:20px;padding:24px;max-width:720px;margin:20px auto}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.controls button,.secret-dialog button{border:0;border-radius:16px;padding:15px 22px;font-size:20px;font-weight:900;background:#ffd85e;cursor:pointer}.controls .next{background:#315b2a;color:white}.secret-dialog{border:0;border-radius:28px;padding:36px;width:min(520px,calc(100% - 30px));text-align:center;box-shadow:0 20px 80px #0006}.secret-dialog::backdrop{background:#173329e8}.secret-word{font-size:clamp(40px,8vw,72px);color:#315b2a;margin:24px 0}</style></head><body><header><a href="./">← Thema 2</a><h1>Klassikaal woordenschatspel</h1><span></span></header><main><section class="game"><p class="secret">🎴 De computer kiest een geheim kaartje. Eén kind bekijkt het woord en houdt het geheim. Daarna beschrijft of beeldt het kind het uit.</p><p id="task" class="task"></p><div id="photo" class="big-photo"></div><h2 id="word" class="word">?</h2><div class="controls"><button id="secret">👀 Bekijk geheim kaartje</button><button id="listen">🔊 Lees de opdracht</button><button id="reveal">Toon antwoord en foto</button><button id="next" class="next">Volgende kaart →</button></div></section></main><dialog id="secretDialog" class="secret-dialog"><p>Laat alleen het kind kijken.</p><h2 id="secretWord" class="secret-word"></h2><button id="hideSecret">Ik heb het gezien</button></dialog><script src="klassikaal.js"></script></body></html>
