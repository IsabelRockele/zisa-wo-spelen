<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Legende met de tekens van een klasplattegrond">
  <rect width="1000" height="700" fill="#fffdf6"/>
  <rect x="85" y="35" width="830" height="630" fill="#fff" stroke="#14766f" stroke-width="10"/>
  <text x="500" y="92" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#40575e">De legende legt kleuren en tekens uit.</text>
